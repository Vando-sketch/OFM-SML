; Eigenständiges PlatformIO-Projekt NUR für Host-Unit-Tests (PC, nicht Mikrocontroller).
; Bewusst unter test/native/ und nicht im Repo-Root: dieses Repo wird als Library
; per Symlink von einem anderen Projekt eingebunden und darf keine Root-platformio.ini haben.
[platformio]
; Quellen unter Test = ../../src; per build_src_filter wird NUR ObisAsciiParser.cpp
; kompiliert (nie SMLChannel.cpp / SMLModule.cpp: Arduino/OpenKNX/libsml nötig).
src_dir = ../../src

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<ObisAsciiParser.cpp>
build_flags = -std=gnu++17 -Wall -Wextra -I../../src
build_unflags = -std=gnu++11
